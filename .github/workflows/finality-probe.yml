name: finality-probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["finality/probe.py", ".github/workflows/finality-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          mkdir -p results
          python3 finality/probe.py \
            rayls=https://mainnet-rpc.rayls.com/ \
            ethereum=https://ethereum-rpc.publicnode.com \
            2>&1 | tee "results/finality-probe-run${{ github.run_id }}.log"
      - name: Commit the log to results/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/finality-probe-run*.log
          git commit -m "results: finality probe ${{ github.run_id }}"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 7; done
